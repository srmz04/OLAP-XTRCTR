[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xtractor-ui"
version = "0.1.0"
description = "Explorador visual y constructor de consultas para servidores OLAP"
requires-python = ">=3.9"
dependencies = [
    "PyQt5>=5.15",
    "pandas>=2.0",
    "keyring>=24.0",
    "cryptography>=41.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
]
build = [
    "pyinstaller>=6.0",
    "nuitka>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
